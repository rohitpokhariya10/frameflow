<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
<!-- Original FrameFlow light study: no imported artwork. Transparent and independently removable. -->
<defs><radialGradient id="warm"><stop stop-color="#ffc477" stop-opacity=".34"/><stop offset="1" stop-color="#ffbc6d" stop-opacity="0"/></radialGradient><radialGradient id="vignette"><stop offset=".30" stop-color="#120c19" stop-opacity="0"/><stop offset="1" stop-color="#120c19" stop-opacity=".68"/></radialGradient><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".64" numOctaves="3" seed="24" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".06"/></feComponentTransfer></filter><filter id="soft"><feGaussianBlur stdDeviation="9"/></filter></defs>
